# hl-news-bot configuration. All money numbers in USDC.
# mode: paper | live   (live additionally requires HL_AGENT_KEY and HL_ACCOUNT in the environment)
# News: NewsLiquid (6551 OpenNews) collects and rates the news. Export OPENNEWS_TOKEN (https://6551.io/mcp).
mode: paper

hyperliquid:
  network: mainnet            # mainnet | testnet  (paper mode reads mainnet prices either way)
  unified_account: false      # true if the HL account uses unified account mode (one USDC balance across dexs; 50k actions/day cap)
  perp_dexs: ["", "xyz"]      # "" = validator perps (BTC/ETH), "xyz" = trade.xyz stock perps
  market_slippage: 0.003      # IOC limit price offset vs mid (0.3%); SDK default is 5%, far too loose
  poll_prices_s: 2.0          # allMids REST polling interval (the bot does not use the SDK WebSocket)

account:
  equity_usd: 2000            # paper starting equity; in live mode this is read from clearinghouseState
  max_risk_per_trade_pct: 1.0 # loss at stop as % of equity
  max_notional_per_trade_usd: 4000
  max_open_positions: 2
  max_gross_leverage: 3.0
  daily_loss_limit_pct: 3.0   # kill switch: stop opening after this day loss
  weekly_loss_limit_pct: 6.0
  cooldown_after_loss_s: 900
  per_coin_cooldown_s: 600

universe:
  crypto: ["BTC", "ETH"]
  stocks: ["xyz:TSLA", "xyz:NVDA", "xyz:AAPL", "xyz:MSFT", "xyz:META", "xyz:GOOGL", "xyz:AMZN", "xyz:MU", "xyz:WDC", "xyz:SNDK", "xyz:SKHX"]
  # NewsLiquid coin tags map to HL coins exactly: "BTC" -> BTC, "XYZ-NVDA" -> xyz:NVDA (its tag for the trade.xyz perp).
  # Plain stock tickers ("NVDA") are ignored on purpose; NewsLiquid adds the XYZ- tag whenever it means the HL perp.
  # Add explicit overrides here when a tag and the HL name differ, e.g. PEPE: kPEPE. All checked against the lists above.
  symbol_map: {}

feeds:
  max_age_s: 120              # default for sources not listed below: items older than this on arrival are dropped
  max_age_by_source:
    newsliquid: 1800          # publisher ts -> NewsLiquid AI rating -> us; per-template max_news_age_s decides what still trades
    hl_listings: 60
    bls_poll: 60
  newsliquid:
    enabled: true
    token_env: OPENNEWS_TOKEN # the token is read from this environment variable; never write the token itself here
    transport: auto           # auto = WebSocket push first, REST polling whenever the socket is refused or down | ws | rest
                              # WebSocket push is a Max-plan feature (99U/month, founder's post 2026-03-10); other plans use REST
    api_base: https://ai.6551.io
    ws_url: wss://ai.6551.io/open/news_wss
    engine_types:             # NewsLiquid engines to subscribe; [] = every source of that engine
      news: []                # 55 sources: Bloomberg, Reuters, FT, CNBC, jin10, BWEnews, Twitter/X KOLs, Truth Social, ...
      listing: []             # Binance, Coinbase, OKX, Bybit, Upbit, Bithumb, Robinhood, Hyperliquid, Aster
    coins: []                 # optional NewsLiquid tags to restrict the stream to, e.g. ["BTC", "ETH", "XYZ-NVDA"]
    has_coin: true            # only items NewsLiquid tagged with at least one coin
    poll_s: 15                # REST interval: 1 quota per call -> 5,760/day, ~173k per 30 days (Pro plan: 200k)
    fast_poll_s: 5            # REST inside a hot window: macro releases, and while a lone-source item waits for its second source
    page_size: 50
    max_pages: 3              # a burst (a whole page of new items) reads up to this many pages; each page is one call
    ws_retry_s: 1800          # after a refused handshake (plan without WS) stay on REST and retry WS every 30 min
    ws_audit_s: 300           # while WS carries the feed, one REST read this often checks the socket is not silently dropping items (0 = off)
    backfill_on_reconnect: true
  hl_listings:
    enabled: true
    poll_s: 5                 # diff of {"type":"meta"} universe -> LISTING_HL events
  macro:
    enabled: true             # BLS schedule + ForexFactory consensus + release-second polling of bls.gov

# How a NewsLiquid rating becomes a signal. The bot does not read the text; these are thresholds and source policy.
rating:
  min_score: 60               # ratings below this are kept on the tape but never directional
  use_coin_rating: true       # when NewsLiquid scores a coin on its own (coins[].score / signal), use that, not the item's top score
  # A coin with no rating of its own: single = use the item's rating only if the item is about one asset ("XYZ-NVDA" and
  # "NVDA" count as one); all = always; none = never. The item score is NewsLiquid's maximum over coins, so on an item
  # tagging oil, BTC and ETH it may be the oil call.
  item_rating_fallback: single
  # NewsLiquid newsType values (case-insensitive) that never trade alone: a second, different source must agree on
  # (class, coin, direction) within the window. Editable in the console ("需要二源佐证的来源").
  require_two_sources_for:
    - twitter
    - twitter/x
    - x / twitter profile
    - telegram
    - weibo
    - medium
  corroboration_window_s: 90
  corroboration_window_by_class:
    nl_news_stock: 1800       # stock stories are re-reported over tens of minutes

# Trade templates per event class. hold_s is the hard time stop. stop/tp are % of entry.
# min_conf: for the NewsLiquid classes this is NewsLiquid's score / 100 (0.80 = score 80); for macro it is the fixed
#           confidence of the arithmetic lane (0.85 CPI surprise, 0.80 NFP surprise); listing_hl is 0.9.
# Optional flags: alert: true  -> push an alert when a directional signal of this class passes its min_conf
#                 trade: false -> alert / log only, never open a position (default true)
#                 max_news_age_s -> ignore items older than this for the class
templates:
  # first-party lanes
  macro_cpi:      {hold_s: 1800, stop_pct: 0.8,  tp_pct: 1.2,  risk_pct: 0.5,  max_lev: 3, min_conf: 0.8, max_news_age_s: 120}
  macro_nfp:      {hold_s: 3600, stop_pct: 0.9,  tp_pct: 1.2,  risk_pct: 0.4,  max_lev: 2, min_conf: 0.8, max_news_age_s: 120}
  listing_hl:     {hold_s: 600,  stop_pct: 3.0,  tp_pct: 4.0,  risk_pct: 0.3,  max_lev: 2, min_conf: 0.9, max_news_age_s: 60}
  # NewsLiquid lanes (one per engineType; news is split into crypto and trade.xyz stock perps)
  nl_news:        {hold_s: 3600, stop_pct: 1.5,  tp_pct: 2.5,  risk_pct: 0.5,  max_lev: 2, min_conf: 0.8, alert: true, max_news_age_s: 300}
  nl_news_stock:  {hold_s: 7200, stop_pct: 2.0,  tp_pct: 3.0,  risk_pct: 0.5,  max_lev: 2, min_conf: 0.8, alert: true, max_news_age_s: 1800}
  # Exchange listings almost never hit this universe (BTC/ETH cannot be "listed"); alert-only until you widen the universe.
  nl_listing:     {hold_s: 600,  stop_pct: 3.0,  tp_pct: 4.0,  risk_pct: 0.3,  max_lev: 2, min_conf: 0.85, alert: true, trade: false, max_news_age_s: 120}
  # nl_market / nl_onchain / nl_meme / nl_prediction: no template -> never traded even if subscribed in engine_types.

storage:
  sqlite_path: data/hlnews.db
  log_path: data/hlnews.log

# Alerts: always written to the alerts table and the log. Telegram needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in
# the environment (Bot API sendMessage; no user session needed). macOS notification uses osascript when running on a Mac.
alerts:
  on: [key_news, open, close, halt, feed]   # key_news = any template with alert: true; feed = a source went down / recovered
  dedup_s: 21600                      # one key-news alert per (class, tickers, direction) per 6 h; re-reports are logged, not pushed
  telegram: true
  macos_notification: true

# Hyperliquid weekly upgrade: post-only window (observed Fri 08:00-09:30 UTC, Aug-Sep 2026). Flatten 5 min before, no new entries inside.
maintenance_window:
  enabled: true
  weekday_utc: 4
  start_utc: "07:55"
  end_utc: "09:35"
